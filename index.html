<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apepeggios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #e0e0e0;
    --muted: #666;
    --dim: #333;
    --surface: #242424;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --up: #6db4ee;
    --up2: #58d8c9;
    --accent: #ffd866;
    --good: #8dd88d;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  .topbar {
    position: fixed;
    top: 1.25rem;
    left: 1.5rem;
    right: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    /* Spans the full width, so let clicks through the empty middle. */
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .mic-debug {
    font-family: var(--mono);
    white-space: pre;   /* keep the padStart alignment; HTML collapses runs of spaces */
    font-size: 0.65rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.1rem;
    font-family: "Lexend Deca", system-ui, -apple-system, sans-serif;
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    user-select: none;
  }
  .brand .trumpet {
    display: inline-block;
    width: 44px;
    height: 44px;
    background: var(--accent);
    -webkit-mask: url("logo.png") center/contain no-repeat;
    mask: url("logo.png") center/contain no-repeat;
    transform: translateY(-3px);
  }
  .brand .wordmark { margin-left: -0.4rem; }
  .brand .ape { color: var(--accent); }
  .brand .peggios { color: var(--muted); }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 2rem; text-align: center; max-width: 100%; }
  .play-area { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; margin-top: 1.5rem; }
  .scale {
    /* Set by fitChordSize(): the largest size at which the longest possible
       chord name still fits, so it never changes as modes are toggled. */
    font-size: var(--scale-size, 3.5rem);
    white-space: nowrap;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
    transition: color 0.15s;
  }
  .scale.success { color: var(--good); }
  .mode-label {
    color: var(--muted);
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .scale-title { display: flex; flex-direction: column; align-items: center; gap: 0.4rem; }
  .scale-title .scale { margin-bottom: 0.8rem; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .hint strong { color: var(--fg); font-weight: 600; }
  .stats { display: flex; gap: 3rem; color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
  /* Reserve room for the widest value each field can reach, so ticking over
     a digit (9 -> 10, 9.9s -> 10.1s) doesn't shift the centred row. */
  .stats strong { color: var(--fg); font-weight: 500; display: inline-block; text-align: right; }
  .stats .stat-count strong { min-width: var(--count-w, 2ch); }
  .stats .stat-time strong { min-width: 8ch; }
  /* Layers share one grid cell so swapping them never shifts the page. */
  .swap { display: grid; }
  .swap > .layer {
    grid-area: 1 / 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    transition: opacity 0.3s ease;
  }
  .swap > .layer.faded { opacity: 0; pointer-events: none; }
  .widget-row { display: flex; gap: 0.5rem; align-items: center; justify-content: center; flex-wrap: wrap; }
  .mode-toggles { flex-wrap: wrap; justify-content: center; max-width: 40rem; }
  .option-bar {
    display: flex;
    gap: 0.1rem;
    justify-content: center;
    align-items: center;
    background: var(--surface);
    border-radius: 5px;
    padding: 0.3rem 0.55rem;
  }
  .option-icon {
    color: var(--muted);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    padding-right: 0.4rem;
    justify-content: center;
  }
  .option-icon svg { width: 16px; height: 16px; display: block; }
  .option-icon.icon-sun svg, .option-icon.icon-moon svg { width: 15px; height: 15px; }
  .option-icon.icon-moon { padding-right: 0; padding-left: 0.4rem; }
  .option-icon.icon-clef {
    font-family: "Bravura Text", "Segoe UI Symbol", "Apple Symbols", serif;
    font-size: 1.9rem;
    line-height: 0.6;
    transform: translate(-1px, 1px);
  }
  .option-bar button {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 0.1rem 0.5rem;
    font-family: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    border-radius: 3px;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
    transition: color 0.1s;
  }
  /* Only real pointers get hover — on touch it sticks after a tap and
     makes the toggle look like it didn't change. */
  @media (hover: hover) {
    .option-bar button:hover { color: var(--fg); }
  }
  .option-bar button.selected { color: var(--accent); }
  .option-bar button:active { transform: scale(0.94); }

  .sequence {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.35rem;
    max-width: 60rem;
  }
  .sequence .note {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    min-height: 1.9rem;
    padding: 0.35rem 0.55rem;
    border: 1px solid var(--dim);
    border-radius: 4px;
    font-size: 0.95rem;
    color: var(--muted);
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  /* An empty pill has no line box and collapses to min-height, then grows
     when its name appears. A zero-width char keeps the height constant. */
  .sequence .note::before { content: "\200b"; }
  .sequence .note.phase-up {
    background: color-mix(in srgb, var(--up) 15%, transparent);
    color: var(--up);
    border-color: var(--up);
  }
  .sequence .note.phase-up2 {
    background: color-mix(in srgb, var(--up2) 18%, transparent);
    color: var(--up2);
    border-color: var(--up2);
  }
  .sequence .note.phase-down {
    background: color-mix(in srgb, var(--good) 15%, transparent);
    color: var(--good);
    border-color: var(--good);
  }
  .sequence .note.phase-arp {
    background: color-mix(in srgb, var(--accent) 22%, transparent);
    color: var(--accent);
    border-color: var(--accent);
  }
  .sequence .note.current {
    box-shadow: 0 0 0 2px var(--fg);
  }
  .sequence .note[data-slot] { cursor: pointer; }
  /* Hidden until played, but still clickable via each note's hit strip. */
  .sequence .note.placeholder { border-color: transparent; cursor: default; }

  .heard {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 140px;
    width: 120px;
  }
  .heard svg { width: 100%; height: 100%; overflow: visible; }
  .heard-text {
    fill: var(--fg);
    font-size: 22px;
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    transition: fill 0.12s ease;
  }
  .tuning-arc { stroke: var(--dim); stroke-width: 3; fill: none; stroke-linecap: round; }


  .results { max-width: 44rem; width: 100%; text-align: center; }
  .session-num { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .deltas { display: flex; justify-content: center; gap: 1.5rem; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .deltas .better { color: var(--good); }
  .deltas .worse { color: var(--bad); }
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem 2rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--dim); }
  .summary div span { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .summary div strong { font-size: 1.4rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--accent); }
  .summary div em { display: block; color: var(--fg); font-size: 0.8rem; font-style: normal; margin-top: 0.15rem; }
  .list { max-height: 35vh; overflow-y: auto; font-variant-numeric: tabular-nums; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .list div {
    display: grid;
    grid-template-columns: 6rem 1fr auto;
    gap: 1rem;
    align-items: baseline;
    text-align: left;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--dim);
  }
  .list .row-mode { color: var(--muted); }
  .list .fast .row-mode, .list .slow .row-mode { color: inherit; opacity: 0.7; }
  .list div:last-child { border-bottom: none; }
  .list .fast { color: var(--accent); }
  .list .slow { color: var(--bad); }

  .mic-warn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--bad);
    color: #1a1a1a;
    border: none;
    padding: 0.4rem 0.8rem;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transform: translateY(3px);
    animation: mic-pulse 1.8s ease-in-out infinite;
  }
  .mic-warn::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1a1a1a;
  }
  .mic-warn:active { transform: translateY(3px) scale(0.96); }
  .mic-warn.hidden { display: none; }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 55%, transparent); }
    70%      { box-shadow: 0 0 0 7px transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mic-warn { animation: none; }
  }

  /* Roomier screens: the phone-tuned sizes read tiny on a large display. */
  @media (min-width: 621px) {
    .mode-label { font-size: 1.3rem; letter-spacing: 0.2em; }
    .scale-title { gap: 0.55rem; }
    .scale-title .scale { margin-bottom: 1rem; }
    .play-area { gap: 2rem; }
    .sequence { gap: 0.5rem; }
    .sequence .note {
      min-width: 3.4rem;
      min-height: 2.6rem;
      padding: 0.5rem 0.8rem;
      font-size: 1.25rem;
      border-radius: 6px;
    }
    .heard { width: 168px; height: 196px; }
    .heard-text { font-size: 30px; }
    .stats { font-size: 1.2rem; gap: 3.5rem; }
    .hint { font-size: 1rem; }
    .option-bar { padding: 0.4rem 0.7rem; border-radius: 6px; }
    .option-bar button { font-size: 0.85rem; padding: 0.15rem 0.6rem; }
    .option-icon svg { width: 19px; height: 19px; }
    .option-icon.icon-sun svg, .option-icon.icon-moon svg { width: 18px; height: 18px; }
    .option-icon.icon-clef { font-size: 2.2rem; }
    .swap > .layer { gap: 1.1rem; }
    .widget-row { gap: 0.7rem; }
    .summary div strong { font-size: 1.6rem; }
    .list { font-size: 1rem; }
  }

  /* Narrow screens: let the 8 note pills shrink to share one row. */
  @media (max-width: 620px) {
    body { padding: 1rem 0.5rem; align-items: stretch; overflow-y: auto; }
    /* These are all shrink-to-fit flex items by default, so the sequence's
       width:100% would resolve against its own content. Stretch the chain. */
    #app, .stage, .play-area { width: 100%; }
    /* The stage fills the height (its own grid handles centring); the results
       screen is a plain block, so centre it here. `safe` so a tall result
       still scrolls from the top instead of clipping. */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: safe center;
      align-items: center;
    }
    /* Equal 1fr rows above and below put the play cluster dead centre on
       screen and push the option bars into the lower half. */
    .stage {
      flex: 1;
      display: grid;
      grid-template-rows: 1fr auto 1fr;
      justify-items: center;
      gap: 1.25rem;
    }
    .play-area { grid-row: 2; }
    .widgets-bottom { grid-row: 3; }
    .play-area, .widgets-bottom { align-self: center; }
    .play-area { gap: 1rem; margin-top: 0; }
    .sequence {
      flex-wrap: nowrap;
      gap: 0.25rem;
      width: 100%;
      /* Taller pills crowd the pattern label above, so add the room here
         rather than letting the row creep upward. */
      margin-top: 0.6rem;
    }
    .sequence .note {
      flex: 1 1 0;
      min-width: 0;
      padding: 0.55rem 0.1rem;
      font-size: 1rem;
    }
    .widgets-bottom .layer { gap: 0.85rem; }
    .widget-row { gap: 0.5rem; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="trumpet" aria-hidden="true"></span>
    <span class="wordmark"><span class="ape">ape</span><span class="peggios">peggios</span></span>
  </div>
  <button id="mic-warn" class="mic-warn">unmute mic</button>
  <span id="mic-debug" class="mic-debug"></span>
</header>
<div id="app"></div>
<script>
// ===== Music theory =====
const MAX_ACCIDENTALS = 7;   // key signatures beyond ±7 sharps/flats are unplayable
const SEMITONES = 12;
const pick = a => a[Math.floor(Math.random() * a.length)];
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const pcMod = n => ((n % SEMITONES) + SEMITONES) % SEMITONES;   // wrap into pitch class 0..11

const keySharpsMajor = {
  "C♭": -7, "G♭": -6, "D♭": -5, "A♭": -4, "E♭": -3, "B♭": -2, "F": -1,
  "C": 0, "G": 1, "D": 2, "A": 3, "E": 4, "B": 5, "F♯": 6, "C♯": 7,
};
const rootPC = {
  "C": 0, "C♯": 1, "D♭": 1, "D": 2, "E♭": 3, "E": 4, "F": 5,
  "F♯": 6, "G♭": 6, "G": 7, "A♭": 8, "A": 9, "B♭": 10, "B": 11, "C♭": 11,
};
const sharpNames = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const flatNames  = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];

// Every mode in one row: display, key-signature offset from major, scale + arp intervals.
// Listed brightest → darkest; the mode-toggle row renders in this order.
const MODES = [
  // Two chord spellings per mode, drilled 50-50: jazz shorthand (− = minor,
  // Δ = major 7th) and the spelled-out form.
  // id               short  sym      txt          off  scale             arp
  ["Lydian",         "lyd", "Δ♯11",  "maj7♯11",     1, [0,2,4,6,7,9,11], [0,4,7,11], false],
  ["Major",          "maj", "Δ7",    "maj7",        0, [0,2,4,5,7,9,11], [0,4,7,11], true ],
  ["Mixolydian",     "mix", "7",     "7",          -1, [0,2,4,5,7,9,10], [0,4,7,10], false],
  ["MelodicMinor",   "mel", "−Δ7",   "m(maj7)",    -3, [0,2,3,5,7,9,11], [0,3,7,11], false],
  ["Dorian",         "dor", "−7",    "m7",         -2, [0,2,3,5,7,9,10], [0,3,7,10], false],
  ["HarmonicMinor",  "har", "−Δ7",   "m(maj7)",    -3, [0,2,3,5,7,8,11], [0,3,7,11], false],
  ["Minor",          "min", "−7",    "m7",         -3, [0,2,3,5,7,8,10], [0,3,7,10], false],
  // Blues has no natural 3rd, so its arp is the in-scale m7.
  ["Blues",          "blu", "7",     "7",          -3, [0,3,5,6,7,10],   [0,3,7,10], false],
].map(([id, short, sym, txt, offset, scale, arp, on]) =>
  ({ id, short, chord: { sym, txt }, offset, scale, arp, on }));

const NOTATIONS = ["sym", "txt"];

const MODE = Object.fromEntries(MODES.map(m => [m.id, m]));
const defaultWeights = Object.fromEntries(MODES.map(m => [m.id, m.on ? 1 : 0]));

const transpositions = {
  "C":  0,   // concert
  "B♭": -2,  // trumpet, tenor sax, clarinet
  "E♭": 3,   // alto sax, bari sax
};
const patternLabels = { scale: "straight", thirds: "3rds", in3s: "in 3s" };
const patternOptions = Object.keys(patternLabels);

// ===== Persistence =====
// store(key, fallback, revive?) → { load, save }. `revive` sanitizes parsed values,
// returning undefined to fall back to the default.
function store(key, fallback, revive) {
  return {
    load() {
      const raw = localStorage.getItem(key);
      if (raw === null) return structuredClone(fallback);
      try {
        const parsed = typeof fallback === "string" ? raw : JSON.parse(raw);
        const value = revive ? revive(parsed) : parsed;
        return value === undefined ? structuredClone(fallback) : value;
      } catch { return structuredClone(fallback); }
    },
    save(value) {
      localStorage.setItem(key, typeof value === "string" ? value : JSON.stringify(value));
    },
  };
}

const historyStore = store("scales-history-v1", [], v => Array.isArray(v) ? v : undefined);
// Filter to known ids — an unrecognised mode would throw in activePools and
// blank the page, which also meant no mode could ever be renamed or removed.
const weightsStore = store("scales-weights-v1", defaultWeights, v => ({
  ...defaultWeights,
  ...Object.fromEntries(Object.entries(v || {}).filter(([m]) => m in MODE)),
}));
const transpositionStore = store("scales-transposition-v1", "C");
// An empty array is a valid saved state (all patterns off), so only a
// non-array falls back to the default.
const patternsStore = store("scales-patterns-v2", ["scale"], v =>
  Array.isArray(v) ? v.filter(p => patternOptions.includes(p)) : undefined);

function activePools(w) {
  const pools = {};
  for (const [mode, wt] of Object.entries(w)) {
    if (wt <= 0) continue;
    pools[mode] = [];
    for (const [key, sig] of Object.entries(keySharpsMajor)) {
      if (Math.abs(sig + MODE[mode].offset) <= MAX_ACCIDENTALS) pools[mode].push(`${key} ${mode}`);
    }
  }
  return pools;
}

// One of each active-mode scale, shuffled (used for unlimited sessions).
function buildUnlimitedList(w) {
  const pools = activePools(w);
  const out = [];
  for (const mode of Object.keys(pools)) out.push(...pools[mode]);
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// Sharps in this mode's signature; negative means flats.
function signatureOf(name) {
  const [key, mode] = name.split(" ");
  return keySharpsMajor[key] + MODE[mode].offset;
}
const useFlats = name => signatureOf(name) < 0;
function noteName(pc, flats) {
  return (flats ? flatNames : sharpNames)[pcMod(pc)];
}

const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
const LETTER_PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function spelledName(letter, targetPc) {
  const base = LETTER_PC[letter];
  let diff = pcMod(targetPc - base);
  if (diff > 6) diff -= 12;
  if (diff === 0) return letter;
  if (diff === 1) return letter + "♯";
  if (diff === 2) return letter + "♯♯";
  if (diff === -1) return letter + "♭";
  if (diff === -2) return letter + "♭♭";
  return noteName(targetPc, false);
}
function scaleSpelling(scaleName) {
  const [key, mode] = scaleName.split(" ");
  const intervals = MODE[mode].scale;
  const root = rootPC[key];
  if (intervals.length !== 7) {
    // 6-note blues: fall back to flat/sharp preference
    const flats = useFlats(scaleName);
    return intervals.map(iv => noteName(pcMod(root + iv), flats));
  }
  const rootLetter = key[0];
  const rootIdx = LETTERS.indexOf(rootLetter);
  return intervals.map((iv, i) => {
    const targetPc = pcMod(root + iv);
    const letter = LETTERS[(rootIdx + i) % 7];
    return spelledName(letter, targetPc);
  });
}
function chordName(scaleName, notation = "sym") {
  const [key, mode] = scaleName.split(" ");
  return key + MODE[mode].chord[notation];
}
function modeOf(scaleName) { return scaleName.split(" ")[1]; }
function displayMode(mode) { return mode.replace(/([a-z])([A-Z])/g, "$1 $2"); }
// ===== Sequence: context, segments, patterns =====
// A path = { pcs, slots, phases } (parallel arrays).
// A pattern is a function of `ctx` returning { single, double?, branchIdx? }.

function scaleContext(scaleName, transposeSemi = 0) {
  const [key, mode] = scaleName.split(" ");
  const root = rootPC[key];
  const scale = MODE[mode].scale.map(i => pcMod(i + root));
  const arp = MODE[mode].arp.map(i => pcMod(i + root));
  const names = scaleSpelling(scaleName);
  const slotOfPc = {};
  scale.forEach((pc, i) => { slotOfPc[pc] = i; });
  const writtenByPc = {};
  scale.forEach((pc, i) => { writtenByPc[pc] = names[i]; });
  return {
    scale, arp,
    slotOfPc,
    octaveSlot: scale.length,
    toConcert: pc => pcMod(pc + transposeSemi),
    displayNames: [...names, names[0]],
    writtenByPc,
  };
}

function segment(ctx, phase, entries) {
  return {
    pcs: entries.map(e => ctx.toConcert(e.pc)),
    slots: entries.map(e => e.slot),
    phases: entries.map(() => phase),
  };
}
function compose(segments) {
  const pcs = [], slots = [], phases = [];
  for (const seg of segments) {
    // An ascent ending on the octave meets a descent starting there; the
    // turnaround note is played once, not struck twice.
    const from = pcs.length && seg.pcs[0] === pcs[pcs.length - 1] ? 1 : 0;
    for (let i = from; i < seg.pcs.length; i++) {
      pcs.push(seg.pcs[i]); slots.push(seg.slots[i]); phases.push(seg.phases[i]);
    }
  }
  return { pcs, slots, phases };
}

// ----- Scale segments -----
function scaleUpSeg(ctx, phase = "up") {
  const e = ctx.scale.map((pc, d) => ({ pc, slot: d }));
  e.push({ pc: ctx.scale[0], slot: ctx.octaveSlot });   // top octave
  return segment(ctx, phase, e);
}
function scaleDownSeg(ctx, phase = "down") {
  const e = [];
  for (let d = ctx.scale.length - 1; d >= 0; d--) e.push({ pc: ctx.scale[d], slot: d });
  return segment(ctx, phase, e);
}
function scaleUp2Seg(ctx) {
  const e = ctx.scale.slice(1).map((pc, i) => ({ pc, slot: i + 1 }));
  e.push({ pc: ctx.scale[0], slot: ctx.octaveSlot });   // 15th (top of 2nd)
  return segment(ctx, "up2", e);
}
function scaleDown2Seg(ctx) {
  const e = [];
  for (let d = ctx.scale.length - 1; d >= 1; d--) e.push({ pc: ctx.scale[d], slot: d });
  e.push({ pc: ctx.scale[0], slot: ctx.octaveSlot });   // octave point (halfway)
  return segment(ctx, "down", e);
}

// ----- Arpeggio segments (chord tones from ctx.arp = [root, 3, 5, 7]) -----
function arp1Seg(ctx) {
  const s = pc => ctx.slotOfPc[pc];
  const [r, t3, t5, t7] = ctx.arp;
  return segment(ctx, "arp", [
    { pc: t3, slot: s(t3) }, { pc: t5, slot: s(t5) }, { pc: t7, slot: s(t7) },
    { pc: t5, slot: s(t5) }, { pc: t3, slot: s(t3) }, { pc: r,  slot: 0 },
  ]);
}
function arp2Seg(ctx) {
  const s = pc => ctx.slotOfPc[pc];
  const [r, t3, t5, t7] = ctx.arp;
  const up = [{ pc: t3, slot: s(t3) }, { pc: t5, slot: s(t5) }, { pc: t7, slot: s(t7) }];
  const dn = [{ pc: t7, slot: s(t7) }, { pc: t5, slot: s(t5) }, { pc: t3, slot: s(t3) }];
  const oct = { pc: r, slot: ctx.octaveSlot };
  return segment(ctx, "arp", [...up, oct, ...up, oct, ...dn, oct, ...dn, { pc: r, slot: 0 }]);
}

// Resolve a scale degree to a note, allowing it to run past either end of
// the octave (8 is the root above, -1 the leading tone below).
function degNote(ctx, deg) {
  const n = ctx.scale.length;
  const idx = ((deg % n) + n) % n;
  // Exact octave multiples (8, 15, ...) belong on the octave pill.
  return { pc: ctx.scale[idx], slot: idx === 0 && deg > 0 ? ctx.octaveSlot : idx };
}

// Pairs a step apart: thirds are step 2. Descending is built from the top
// down rather than reversed, so it opens 8-6 instead of jumping up to the
// 9th, and finishes 3-1, 2-7, 1 instead of stopping at 3-1.
// Walks the scale once per degree and lets `emit` decide what each step
// plays. `dir` is +1 ascending / -1 descending, so an emit written once works
// in both directions; the run finishes on the octave or the root.
function walkSeg(ctx, phase, direction, octaves, emit) {
  const top = ctx.scale.length * octaves;
  const up = direction === "up";
  const e = [];
  for (let d = up ? 0 : top; up ? d < top : d > 0; up ? d++ : d--) emit(e, d, up ? 1 : -1);
  e.push(degNote(ctx, up ? top : 0));
  return segment(ctx, phase, e);
}

// Pairs a step apart: thirds are step 2.
const intervalSeg = (ctx, step, phase = "up", direction = "up", octaves = 1) =>
  walkSeg(ctx, phase, direction, octaves,
    (e, d, dir) => e.push(degNote(ctx, d), degNote(ctx, d + dir * step)));

// Runs of consecutive degrees: 1-2-3, 2-3-4, ...
const groupSeg = (ctx, size, phase = "up", direction = "up", octaves = 1) =>
  walkSeg(ctx, phase, direction, octaves, (e, d, dir) => {
    for (let k = 0; k < size; k++) e.push(degNote(ctx, d + dir * k));
  });

// ----- Patterns -----
const patterns = {
  scale: {
    single: ctx => compose([scaleUpSeg(ctx), scaleDownSeg(ctx), arp1Seg(ctx)]),
    double: ctx => {
      const p = compose([scaleUpSeg(ctx), scaleUp2Seg(ctx), scaleDown2Seg(ctx), scaleDownSeg(ctx), arp2Seg(ctx)]);
      // Both the root and the octave belong to the two-octave ascent, so they
      // turn turquoise with the rest of it once the path is committed.
      p.phases[0] = "up2";
      p.phases[ctx.scale.length] = "up2";
      return p;
    },
    branchIdx: ctx => ctx.scale.length + 1,
  },
  thirds: {
    single: ctx => compose([intervalSeg(ctx, 2, "up"), intervalSeg(ctx, 2, "down", "down")]),
    double: ctx => compose([intervalSeg(ctx, 2, "up", "up", 2),
                            intervalSeg(ctx, 2, "down", "down", 2)]),
    branchIdx: ctx => ctx.scale.length * 2 + 1,
  },
  in3s: {
    single: ctx => compose([groupSeg(ctx, 3, "up"), groupSeg(ctx, 3, "down", "down")]),
    double: ctx => compose([groupSeg(ctx, 3, "up", "up", 2),
                            groupSeg(ctx, 3, "down", "down", 2)]),
    branchIdx: ctx => ctx.scale.length * 3 + 1,
  },
};

function buildExpected(scaleName, transposeSemi = 0, patternKey = "scale") {
  const ctx = scaleContext(scaleName, transposeSemi);
  const pat = patterns[patternKey] || patterns.scale;
  const single = pat.single(ctx);
  const double = pat.double ? pat.double(ctx) : null;
  const branchIdx = double && pat.branchIdx ? pat.branchIdx(ctx) : null;
  return {
    single, double, branchIdx,
    displayNames: ctx.displayNames,
    writtenByPc: ctx.writtenByPc,
    octaveSlot: ctx.octaveSlot,
  };
}

function getPhaseAt(i, matchIdx, path) {
  const p = path.phases[i];
  // Peak of an "up" phase becomes "down" once the note AFTER it has been played (turnaround confirmed).
  if ((p === "up" || p === "up2") && matchIdx > i + 1 && path.phases[i + 1] === "down") return "down";
  return p;
}

// ===== Pitch detection (autocorrelation) =====
const PITCH = {
  minFreq: 41, maxFreq: 1400,    // E1 up; low end verified against synthetic tones
  minRms: 0.0015,                // hard floor only; the tracker's adaptive gate does the real work
  trimThreshold: 0.2,            // edge-trim amplitude for the correlation window
  minWindow: 64,                 // samples needed for a usable correlation
  a4: 440, a4Midi: 69,
};

function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  let sumSq = 0;
  for (let i = 0; i < SIZE; i++) sumSq += buf[i] * buf[i];
  const rms = Math.sqrt(sumSq / SIZE);
  if (rms < PITCH.minRms) return { freq: -1, rms };

  let r1 = 0, r2 = SIZE - 1;
  const thres = PITCH.trimThreshold;
  for (let i = 0; i < SIZE / 2; i++)
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++)
    if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  const trimmed = buf.slice(r1, r2);
  const N = trimmed.length;
  if (N < PITCH.minWindow) return { freq: -1, rms };

  const c = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let s = 0;
    for (let j = 0; j < N - i; j++) s += trimmed[j] * trimmed[j + i];
    c[i] = s;
  }

  let d = 0;
  while (d + 1 < N && c[d] > c[d + 1]) d++;
  let maxv = -Infinity, maxi = -1;
  for (let i = d; i < N; i++) if (c[i] > maxv) { maxv = c[i]; maxi = i; }
  if (maxi < 1 || maxi >= N - 1) return { freq: -1, rms };

  const x1 = c[maxi - 1], x2 = c[maxi], x3 = c[maxi + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  const T0 = maxi - (a ? b / (2 * a) : 0);
  const freq = sampleRate / T0;
  if (freq < PITCH.minFreq || freq > PITCH.maxFreq) return { freq: -1, rms };
  return { freq, rms };
}

function freqToMidi(freq) {
  return PITCH.a4Midi + SEMITONES * Math.log2(freq / PITCH.a4);
}
function freqToPC(freq) {
  const midi = Math.round(freqToMidi(freq));
  return pcMod(midi);
}
function freqToCents(freq) {
  const midi = freqToMidi(freq);
  return (midi - Math.round(midi)) * 100;  // in [-50, 50)
}

// ===== Note tracker: emits a note event on each stable pitch onset =====
// Gates are relative to the measured noise floor rather than absolute, since
// input level varies wildly by device (a phone and a laptop hand you very
// different amplitudes for the same trumpet).
const TRACKER = {
  holdMs: 250,       // a pitch must be sustained this long to count as played
  onRatio: 10,       // attack when RMS exceeds this multiple of the floor
  offRatio: 0.4,     // release when RMS drops below this fraction of the attack gate
  minOn: 0.006,      // absolute floor so a silent room doesn't trigger on nothing
  maxOn: 0.03,       // hard ceiling: a bad floor estimate must never deafen us
  floorFall: 0.1,    // floor tracks downward fast...
  floorRise: 0.002,  // ...and upward slowly, so it converges on true ambient
};

// A laptop mic sits further away and hears more of the room than a phone
// held close, so it needs a higher bar to avoid triggering on noise.
const GATE_BOOST = window.matchMedia("(hover: hover)").matches ? 1.8 : 1;

class NoteTracker {
  constructor(onNote) {
    this.onNote = onNote;
    this.reset();
    this.noiseFloor = null;
  }
  reset() {
    this.state = "silent";
    this.currentPC = -1;
    this.candPC = -1;
    this.candSince = 0;
  }
  get rmsOn() {
    const scaled = (this.noiseFloor ?? 0) * TRACKER.onRatio * GATE_BOOST;
    return Math.min(TRACKER.maxOn * GATE_BOOST,
                    Math.max(TRACKER.minOn * GATE_BOOST, scaled));
  }
  process(rms, freq, now) {
    const onGate = this.rmsOn;
    if (this.state === "silent") {
      // Seed from the very first frame at any level. With no floor the gate
      // sits at its minimum, so a room louder than that could never satisfy
      // the "quiet enough to sample" test and would be treated as signal
      // for the whole session.
      if (this.noiseFloor === null) this.noiseFloor = rms;
      // Thereafter only track while genuinely quiet, or the bar climbs in
      // step with the playing and can never be crossed.
      else if (rms < onGate) {
        const a = rms < this.noiseFloor ? TRACKER.floorFall : TRACKER.floorRise;
        this.noiseFloor += (rms - this.noiseFloor) * a;
      }
      this.noiseFloor = Math.min(this.noiseFloor, TRACKER.maxOn / TRACKER.onRatio);
    }
    if (this.state === "playing" && rms < onGate * TRACKER.offRatio) {
      this.state = "silent"; this.currentPC = -1; this.candPC = -1;
      return;
    }
    if (this.state === "silent" && rms < onGate) return;

    const pc = freq > 0 ? freqToPC(freq) : -1;
    if (pc < 0) return;

    // A new pitch has to hold steady before it counts. This is the whole
    // anti-gliss rule: a slide passes through pitches far too briefly.
    if (pc !== this.candPC) { this.candPC = pc; this.candSince = now; return; }
    if (pc === this.currentPC) return;                        // already counted
    if (now - this.candSince < TRACKER.holdMs) return;        // not held yet
    this.state = "playing";
    this.currentPC = pc;
    this.onNote(pc, freqToCents(freq));
  }
}

// ===== Matcher =====
class Matcher {
  constructor(expected, { onProgress, onSuccess }) {
    this.expected = expected;
    this.matchIdx = 0;
    this.cents = [];
    this.path = null;  // "single" or "double"; decided at branchIdx
    this.rewindTimer = null;
    this.onProgress = onProgress;
    this.onSuccess = onSuccess;
  }
  currentPath() {
    return this.expected[this.path || "single"];
  }
  input(pc, cents = 0) {
    clearTimeout(this.rewindTimer);   // a new note supersedes a pending rewind
    // At the branch point, choose single or double based on what the player hits.
    if (this.path === null && this.matchIdx === this.expected.branchIdx) {
      if (pc === this.expected.single.pcs[this.matchIdx]) this.path = "single";
      else if (pc === this.expected.double.pcs[this.matchIdx]) this.path = "double";
    }
    const path = this.currentPath();
    if (pc === path.pcs[this.matchIdx]) {
      this.cents.push(cents);
      this.matchIdx++;
      this.onProgress(this.matchIdx);
      if (this.matchIdx === path.pcs.length) {
        this.onSuccess();
      }
      return;
    }
    // Going back to a note already played rewinds to just past it, but only
    // after it survives another hold. Any note arriving first cancels it, so
    // a stray detection you play straight through never costs you progress.
    for (let k = this.matchIdx - 1; k >= 0; k--) {
      if (path.pcs[k] === pc) {
        this.rewindTimer = setTimeout(() => {
          this.cents.length = k + 1;
          this.cents[k] = cents;
          this.matchIdx = k + 1;
          this.onProgress(this.matchIdx);
        }, TRACKER.holdMs);
        return;
      }
    }
  }
  // Stops a pending rewind from firing into a matcher that has been replaced.
  cancel() { clearTimeout(this.rewindTimer); }
}


// Let a correct run sit green long enough to register before moving on.
const SUCCESS_HOLD_MS = 600;

// ===== Audio =====
// Read a #rrggbb custom property as [r,g,b] so a colour lives in exactly one
// place — the :root block.
// Tuner: fixed 120x140 viewBox; the letter sits in a masked circle at (cx, baselineY).
const TUNER = {
  width: 120, height: 140,
  cx: 60, baselineY: 70, maskRadius: 22, arcLeft: 12, arcRight: 108,
  maxCents: 40,          // arc saturates here
  bendPerCent: 2.0,      // control-point rise per cent sharp
  smoothing: 0.28,       // EMA weight on each new reading
  redAtCents: 30,        // |cents| where the color reaches full red
  inTune: [141, 216, 141],      // keep in sync with --good
  outOfTune: [255, 107, 107],   // keep in sync with --bad
};
const FLAT_ARC = `M ${TUNER.arcLeft} ${TUNER.baselineY} Q ${TUNER.cx} ${TUNER.baselineY} ${TUNER.arcRight} ${TUNER.baselineY}`;

function tuningArcPath(cents) {
  // Sharp → bends upward (control point above baseline). Flat → bends downward.
  const c = Math.max(-TUNER.maxCents, Math.min(TUNER.maxCents, cents));
  const controlY = TUNER.baselineY - c * TUNER.bendPerCent;
  return `M ${TUNER.arcLeft} ${TUNER.baselineY} Q ${TUNER.cx} ${controlY.toFixed(1)} ${TUNER.arcRight} ${TUNER.baselineY}`;
}
function centsToColor(cents) {
  const t = Math.min(Math.abs(cents), TUNER.redAtCents) / TUNER.redAtCents;
  const rgb = TUNER.inTune.map((from, i) => Math.round(from + (TUNER.outOfTune[i] - from) * t));
  return `rgb(${rgb.join(",")})`;
}

let micError = "";

let audioCtx = null, analyser = null, mediaStream = null, audioBuf = null;
let noteTracker = null;
let smoothedCents = 0;

// Processing only hurts pitch detection: AGC fights the RMS gate, noise
// suppression carves out harmonics, echo cancellation adds artifacts. Raw
// audio is a hard requirement — a browser that won't give it gets no mic.
const RAW_AUDIO = {
  echoCancellation: { exact: false },
  noiseSuppression: { exact: false },
  autoGainControl: { exact: false },
};

let micPending = false;

// Getting the stream is safe anywhere, but building the AudioContext is not:
// iOS hands back a permanently silent graph if it is created outside a user
// gesture. So ask for permission on load and wire up the graph on first input.
async function requestMic() {
  if (mediaStream || micPending) return !!mediaStream;
  micPending = true;
  try {
    if (!window.isSecureContext) throw new Error("needs https");
    if (!navigator.mediaDevices?.getUserMedia) throw new Error("no getUserMedia");
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: RAW_AUDIO });
    micError = "";
    return true;
  } catch (e) {
    micError = e.name === "OverconstrainedError"
      ? "raw audio refused" : (e.message || e.name);
    setMicStatus(false);
    return false;
  } finally {
    micPending = false;
  }
}

// Call from a user gesture.
function startAudioGraph() {
  if (audioCtx || !mediaStream) return false;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(mediaStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
  audioBuf = new Float32Array(analyser.fftSize);
  audioCtx.resume?.();
  setMicStatus(true);
  detectLoop();
  return true;
}

async function initMic() {
  if (!await requestMic()) return false;
  return audioCtx ? true : startAudioGraph();
}

async function resumeAudioIfNeeded() {
  if (audioCtx && audioCtx.state === "suspended") {
    try { await audioCtx.resume(); } catch {}
  }
}
function setMicStatus(on) {
  const el = document.getElementById("mic-warn");
  if (!el) return;
  el.classList.toggle("hidden", on);
  el.textContent = micError ? `mic: ${micError}` : "unmute mic";
}
function detectLoop() {
  if (!analyser) return;
  analyser.getFloatTimeDomainData(audioBuf);
  const { freq, rms } = autoCorrelate(audioBuf, audioCtx.sampleRate);
  const active = state === "playing" || state === "ready";
  if (noteTracker && active && performance.now() > suppressDetectUntil) noteTracker.process(rms, freq, performance.now());
  if (micDebug) {
    // Dashes stand in at exactly the width of a reading, so the pitch
    // dropping in and out swaps in place instead of resizing the line.
    const hz = (freq > 0 ? freq.toFixed(0) + "hz" : "-----").padStart(6);
    micDebug.textContent = `rms ${rms.toFixed(4)} gate ${noteTracker.rmsOn.toFixed(4)}`
      + ` floor ${(noteTracker.noiseFloor ?? 0).toFixed(4)} ${hz}`;
  }
  if (active) renderTuner(freq, rms);
  requestAnimationFrame(detectLoop);
}

function renderTuner(freq, rms) {
  const heardEl = document.getElementById("heard");
  if (!heardEl || !scales[index]) return;
  const textEl = heardEl.querySelector(".heard-text");
  const arcEl = heardEl.querySelector(".tuning-arc");
  // Follows the live signal rather than the tracker's confirmed note: you
  // should see the pitch the instant you sound it, even though it takes a
  // full hold before it counts as played.
  const sounding = freq > 0 && rms >= (noteTracker?.rmsOn ?? Infinity) * TRACKER.offRatio;
  if (!sounding) {
    if (textEl) { textEl.textContent = "—"; textEl.style.fill = ""; }
    smoothedCents = 0;
    if (arcEl) { arcEl.setAttribute("d", FLAT_ARC); arcEl.style.stroke = ""; }
    return;
  }
  const t = transpositions[transposition] || 0;
  const writtenPc = pcMod(freqToPC(freq) - t);
  const nameMap = currentMatcher?.expected.writtenByPc || {};
  textEl.textContent = nameMap[writtenPc] || noteName(writtenPc, useFlats(scales[index]));
  smoothedCents += (freqToCents(freq) - smoothedCents) * TUNER.smoothing;
  const color = centsToColor(smoothedCents);
  textEl.style.fill = color;
  if (arcEl) {
    arcEl.setAttribute("d", tuningArcPath(smoothedCents));
    arcEl.style.stroke = color;
  }
}

// ===== Reference tone =====
// Sounds at concert pitch, matching what the horn would actually produce.
let suppressDetectUntil = 0;

function playPitch(concertPc, slot) {
  if (!audioCtx || !currentMatcher) return;
  const path = currentMatcher.currentPath();
  const rel = pcMod(concertPc - path.pcs[0]);
  const octave = slot === currentMatcher.expected.octaveSlot ? 12 : 0;
  const midi = 48 + path.pcs[0] + rel + octave;
  const t = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "triangle";
  osc.frequency.value = PITCH.a4 * Math.pow(2, (midi - PITCH.a4Midi) / SEMITONES);
  gain.gain.setValueAtTime(0, t);
  gain.gain.linearRampToValueAtTime(0.22, t + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + 0.6);

  // Don't let the speakers feed the tone back into the matcher.
  suppressDetectUntil = performance.now() + 700;
  noteTracker?.reset();
}

// Clicking a pill jumps to the next place that note is due, revealing
// everything up to it. Searching the committed path means the second octave
// is only reachable once you've actually chosen it.
function jumpToSlot(slot) {
  if (!currentMatcher || nothingSelected()) return;
  if (state === "ready") beginPlaying();
  const path = currentMatcher.currentPath();
  let idx = -1;
  for (let i = currentMatcher.matchIdx; i < path.slots.length; i++) {
    if (path.slots[i] === slot) { idx = i; break; }
  }
  if (idx < 0) return;
  currentMatcher.matchIdx = idx + 1;
  // Jumping past the branch point commits to the path we searched, otherwise
  // the branch test never fires again and the second octave is locked out.
  if (currentMatcher.expected.branchIdx !== null
      && currentMatcher.matchIdx > currentMatcher.expected.branchIdx
      && currentMatcher.path === null) {
    currentMatcher.path = "single";
  }
  // null, not 0 — a revealed note shouldn't score as perfectly in tune.
  while (currentMatcher.cents.length < currentMatcher.matchIdx) currentMatcher.cents.push(null);
  currentMatcher.cents.length = currentMatcher.matchIdx;
  updateSequenceUI();
  playPitch(path.pcs[idx], slot);
}

// ===== App state =====
// Touch devices skip by tapping; pointer devices skip by keypress only, so a
// stray click on the page doesn't blow through a scale.
const isTouch = () => !window.matchMedia("(hover: hover)").matches;
const restartHint = () => isTouch()
  ? "<strong>tap</strong> to restart" : "press <strong>key</strong> to restart";

const DEBUG = location.hostname !== "apepeggios.com"
  || new URLSearchParams(location.search).has("debug");
const app = document.getElementById("app");
const micDebug = DEBUG ? document.getElementById("mic-debug") : null;
if (!DEBUG) document.getElementById("mic-debug")?.remove();
let scales, times, state, scaleStart, index;
let skipped = 0;
let lastSession = null;   // the session just finished, or null if nothing counted
let currentMatcher = null;
let weights = weightsStore.load();
let transposition = transpositionStore.load();
let activePatterns = patternsStore.load();
let currentPattern = activePatterns[0];
let currentNotation = NOTATIONS[0];
function pickPattern() {
  if (!activePatterns.length) return null;   // all off — same as all modes off
  return pick(activePatterns);
}

  return pick(NOTATIONS);
}

function fmt(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(2) + "s";
  const m = Math.floor(s / 60);
  const rem = (s % 60).toFixed(1).padStart(4, "0");
  return `${m}m ${rem}s`;
}

function resetSession() {
  times = [];
  skipped = 0;
  index = 0;
  repick();
  scales = buildUnlimitedList(weights);
  fitChordSize();
}

// Size to the widest name the app can ever produce, not just the ones in this
// session, so toggling a mode never resizes the display mid-use.
const CHORD_MAX_PX = 88;    // phones
const CHORD_MAX_PX_WIDE = 124;  // roomier screens
// Canvas needs the stack as a string; must match --mono.
const CHORD_FONT = '700 %dpx ui-monospace, "SF Mono", Menlo, monospace';
const LONGEST_CHORD = Object.keys(keySharpsMajor)
  .flatMap(key => MODES.flatMap(m => NOTATIONS.map(n => key + m.chord[n])))
  .reduce((a, b) => b.length > a.length ? b : a, "");
let measureCtx = null;

function fitChordSize() {
  const longest = LONGEST_CHORD;
  measureCtx ??= document.createElement("canvas").getContext("2d");
  const avail = document.documentElement.clientWidth - 24;
  const cap = avail > 620 ? CHORD_MAX_PX_WIDE : CHORD_MAX_PX;
  measureCtx.font = CHORD_FONT.replace("%d", cap);
  const needed = measureCtx.measureText(longest).width;
  const px = needed > avail ? Math.floor(cap * avail / needed) : cap;
  document.documentElement.style.setProperty("--scale-size", px + "px");
}

function start() {
  resetSession();
  state = "ready";
  render();
}

function render() {
  if (state === "done") return renderResults();
  renderStage();   // handles both "ready" and "playing"
}

// True when there's nothing to practice because a whole toggle row is off.
function nothingSelected() { return !scales[index] || !currentPattern; }
function emptyStateLabel() {
  const missing = [];
  if (!scales[index]) missing.push("modes");
  if (!currentPattern) missing.push("patterns");
  return `no ${missing.join(" or ")} on`;
}

// Returns { html, exp } — exp is null when there is nothing to practise.
function playAreaHTML(scaleName) {
  // Mirror the real layout's structure so toggling the last one off doesn't resize the page.
  if (nothingSelected()) return { exp: null, html: `
    <div class="scale-title">
      <div class="scale">&nbsp;</div>
      <div class="mode-label">${emptyStateLabel()}</div>
      <div class="mode-label">&nbsp;</div>
    </div>
    <div class="sequence"><span class="note placeholder"></span></div>
    <div class="heard"></div>
  ` };
  const exp = buildExpected(scaleName, transpositions[transposition] || 0, currentPattern);
  const seq = exp.displayNames.map((name, i) =>
    `<span class="note" data-slot="${i}" data-full="${name}"></span>`).join("");
  // Always rendered, mic or not, so enabling the mic doesn't reflow the page.
  const heardHTML = `
    <div class="heard" id="heard">
      <svg viewBox="0 0 ${TUNER.width} ${TUNER.height}" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <mask id="letter-mask">
            <rect fill="white" width="${TUNER.width}" height="${TUNER.height}"/>
            <circle fill="black" cx="${TUNER.cx}" cy="${TUNER.baselineY}" r="${TUNER.maskRadius}"/>
          </mask>
        </defs>
        <path class="tuning-arc" d="${FLAT_ARC}" mask="url(#letter-mask)"/>
        <text class="heard-text" x="${TUNER.cx}" y="${TUNER.baselineY + 8}" text-anchor="middle">—</text>
      </svg>
    </div>
  `;
  return { exp, html: `
    <div class="scale-title">
      <div class="scale">${chordName(scaleName, currentNotation)}</div>
      <div class="mode-label">${displayMode(modeOf(scaleName))}</div>
      <div class="mode-label">${patternLabels[currentPattern]}</div>
    </div>
    <div class="sequence" id="sequence">${seq}</div>
    ${heardHTML}
  ` };
}

function renderStage() {
  const play = playAreaHTML(scales[index]);
  const transposeButtons = Object.keys(transpositions).map(t =>
    `<button class="${t === transposition ? "selected" : ""}" data-trans="${t}">${t}</button>`).join("");
  const patternButtons = patternOptions.map(p =>
    `<button class="${activePatterns.includes(p) ? "selected" : ""}" data-pattern="${p}">${patternLabels[p]}</button>`).join("");
  const modeButtons = MODES.map(m =>
    `<button class="${weights[m.id] > 0 ? "selected" : ""}" data-mode-toggle="${m.id}">${m.short}</button>`).join("");

  const playing = state === "playing";
  app.innerHTML = `
    <div class="stage">
      <div class="play-area">${play.html}</div>
      <div class="swap widgets-bottom">
        <div class="layer ${playing ? "faded" : ""}">
          <div class="option-bar mode-toggles" id="mode-toggles">
            <span class="option-icon icon-sun" aria-hidden="true" title="brightest">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
            </span>
            ${modeButtons}
            <span class="option-icon icon-moon" aria-hidden="true" title="darkest">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 15.5A8 8 0 0 1 9 5a7 7 0 1 0 11 10.5z"/></svg>
            </span>
          </div>
          <div class="widget-row">
            <div class="option-bar" id="pattern-radio"><span class="option-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="currentColor"><ellipse cx="5" cy="15" rx="2.5" ry="1.8"/><ellipse cx="14" cy="13" rx="2.5" ry="1.8"/><rect x="7" y="4" width="1.2" height="11"/><rect x="16" y="2" width="1.2" height="11"/><path d="M8 4.5 L17 2.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
            </span>${patternButtons}</div>
            <div class="option-bar" id="transpose-radio"><span class="option-icon icon-clef" aria-hidden="true">𝄞</span>${transposeButtons}</div>
          </div>
        </div>
        <div class="layer ${playing ? "" : "faded"}">
          <div class="stats" style="--count-w: ${String(scales.length).length}ch">
            <span class="stat-count"><strong>${index + 1}</strong> / ${scales.length}</span>
            <span class="stat-time" id="timer"><strong>0.00s</strong> / scale</span>
          </div>
          <div class="hint">${audioCtx ? "auto-advances on correct play · " : ""}${isTouch() ? "<strong>tap</strong> skips" : "<strong>key</strong> skips · <strong>esc</strong> restarts"}</div>
        </div>
      </div>
    </div>
  `;

  setupMatcher(play.exp);
  updateSequenceUI();
  attachReadyHandlers();
  if (playing) tickTimer();
}

function repick() {
  currentPattern = pickPattern();
  currentNotation = pickNotation();
}

// Toggle any of N: `flip` mutates state and reports the button's new state.
function bindToggles(id, attr, flip) {
  document.querySelectorAll(`#${id} button`).forEach(btn =>
    btn.addEventListener("click", e => {
      e.currentTarget.classList.toggle("selected", flip(e.currentTarget.dataset[attr]));
      refreshPlayArea();
    }));
}

function attachReadyHandlers() {
  const transposeButtons = document.querySelectorAll("#transpose-radio button");
  transposeButtons.forEach(btn => btn.addEventListener("click", e => {
    transposition = e.currentTarget.dataset.trans;
    transpositionStore.save(transposition);
    transposeButtons.forEach(b => b.classList.toggle("selected", b === e.currentTarget));
    refreshPlayArea();
  }));
  bindToggles("pattern-radio", "pattern", p => {
    const i = activePatterns.indexOf(p);
    if (i >= 0) activePatterns.splice(i, 1); else activePatterns.push(p);
    patternsStore.save(activePatterns);
    repick();
    return activePatterns.includes(p);
  });
  bindToggles("mode-toggles", "modeToggle", m => {
    weights[m] = weights[m] > 0 ? 0 : 1;
    weightsStore.save(weights);
    resetSession();
    return weights[m] > 0;
  });
}

function refreshPlayArea() {
  const playArea = document.querySelector(".play-area");
  if (!playArea) return;
  const play = playAreaHTML(scales[index]);
  playArea.innerHTML = play.html;
  setupMatcher(play.exp);
  updateSequenceUI();
}

function setupMatcher(exp) {
  currentMatcher?.cancel();
  noteTracker?.reset();
  if (!exp) { currentMatcher = null; return; }
  currentMatcher = new Matcher(exp, {
    onProgress() {
      updateSequenceUI();
      // The tracker only reports sustained pitches, so the first one to
      // arrive is already proof of real playing.
      if (state === "ready") beginPlaying();
    },
    onSuccess: onSequenceComplete,
  });
}



function beginPlaying() {
  if (state !== "ready" || nothingSelected()) return;
  resumeAudioIfNeeded();
  const now = performance.now();
  scaleStart = now;
  state = "playing";
  // Cross-fade the option layers out and the play layers in; nothing moves.
  document.querySelectorAll(".swap").forEach(swap => {
    swap.querySelectorAll(".layer").forEach(l => l.classList.toggle("faded"));
  });
  tickTimer();
}




function updateSequenceUI() {
  if (!currentMatcher) return;
  const matchIdx = currentMatcher.matchIdx;
  const path = currentMatcher.currentPath();
  document.querySelectorAll(".sequence .note").forEach(n => {
    n.classList.remove("phase-up", "phase-up2", "phase-down", "phase-arp", "current");
    // Rewinding must hide the names again, not just drop the colour.
    if (n.dataset.full) n.textContent = "";
  });
  for (let i = 0; i < matchIdx; i++) {
    const slot = path.slots[i];
    if (slot === undefined) continue;
    const el = document.querySelector(`.sequence .note[data-slot="${slot}"]`);
    if (!el) continue;
    const phase = getPhaseAt(i, matchIdx, path);
    el.classList.add(`phase-${phase}`);
    if (el.dataset.full) el.textContent = el.dataset.full;
  }
  if (matchIdx < path.pcs.length) {
    const slot = path.slots[matchIdx];
    if (slot !== undefined) {
      const el = document.querySelector(`.sequence .note[data-slot="${slot}"]`);
      if (el) el.classList.add("current");
    }
  }
}

// Held across the success hold so that advancing by hand during it still
// records the run — the playing already happened.
let pendingCents = null;

function onSequenceComplete() {
  pendingCents = currentMatcher?.cents ?? [];
  currentMatcher = null;
  const scaleEl = document.querySelector(".scale");
  if (scaleEl) scaleEl.classList.add("success");
  document.querySelectorAll(".sequence .note").forEach(n => n.classList.remove("current"));
  advanceTimer = setTimeout(completeCurrent, SUCCESS_HOLD_MS);
}

let advanceTimer = null;
// `cents` present means the tracker matched the whole sequence. Called with
// nothing, it is a manual advance — a skip however long it took, because
// nothing verified the scale was played.
function completeCurrent(cents = pendingCents) {
  // A keypress during the success hold would otherwise advance twice.
  clearTimeout(advanceTimer);
  advanceTimer = null;
  pendingCents = null;
  const now = performance.now();
  // scaleStart is stamped when the first note confirms, so only the other
  // N-1 have to wait out the hold. A genuine run cannot beat that, which
  // makes anything faster a spurious match rather than a performance.
  const floorMs = Math.max(0, cents ? cents.length - 1 : 0) * TRACKER.holdMs;
  if (cents && now - scaleStart >= floorMs) {
    const cList = cents.filter(c => typeof c === "number");
    times.push({
      scale: scales[index],
      ms: now - scaleStart,
      cents: cList.length ? mean(cList.map(Math.abs)) : null,
    });
  } else {
    skipped++;
  }
  scaleStart = now;
  index++;
  repick();
  if (index >= scales.length) {
    state = "done";
    recordSession();
  }
  render();
}

let timerGen = 0;
function tickTimer() {
  const gen = ++timerGen;   // supersede any loop from a previous scale
  (function step() {
    if (gen !== timerGen || state !== "playing") return;
    const el = document.getElementById("timer");
    if (el) el.innerHTML = `<strong>${fmt(performance.now() - scaleStart)}</strong> / scale`;
    requestAnimationFrame(step);
  })();
}


function recordSession() {
  if (times.length === 0) { lastSession = null; return; }   // all skipped — nothing to save
  const total = times.reduce((s, t) => s + t.ms, 0);
  const cList = times.map(t => t.cents).filter(c => typeof c === "number");
  const avgCents = cList.length ? mean(cList) : null;
  const session = {
    date: new Date().toISOString(),
    avg_ms: Math.round(total / times.length),
    avg_cents: avgCents !== null ? Math.round(avgCents * 10) / 10 : null,
    skipped,
    times: times.map(t => ({
      scale: t.scale,
      ms: Math.round(t.ms),
      cents: typeof t.cents === "number" ? Math.round(t.cents * 10) / 10 : null,
    })),
  };
  const h = historyStore.load();
  h.push(session);
  historyStore.save(h);
  lastSession = session;
}

function deltaHTML(cur, other, label) {
  const d = cur - other;
  if (d === 0) return `<span>= ${label}</span>`;
  const cls = d < 0 ? "better" : "worse";
  const arrow = d < 0 ? "▼" : "▲";
  return `<span class="${cls}">${arrow} ${fmt(Math.abs(d))} vs ${label}</span>`;
}

function renderResults() {
  const cur = lastSession;
  if (!cur) {
    app.innerHTML = `
      <div class="results">
        <div class="session-num">every scale skipped — nothing recorded</div>
        <div class="hint">${restartHint()}</div>
      </div>
    `;
    return;
  }
  const h = historyStore.load();
  const prev = h.length > 1 ? h[h.length - 2] : null;
  // Compare per-scale pace, not session totals — the scale count varies with
  // which modes are toggled on, so totals aren't comparable across sessions.
  const best = h.reduce((b, s) => s.avg_ms < b.avg_ms ? s : b);
  const isPB = cur.avg_ms === best.avg_ms && h.length > 1;
  const sorted = cur.times.slice().sort((a, b) => a.ms - b.ms);
  const fastest = sorted[0], slowest = sorted[sorted.length - 1];
  let deltas = "";
  if (prev) {
    deltas = `<div class="deltas">
      ${deltaHTML(cur.avg_ms, prev.avg_ms, "prev")}
      ${deltaHTML(cur.avg_ms, best.avg_ms, "best")}
      ${isPB ? '<span class="better">★ new best</span>' : ""}
    </div>`;
  }
  app.innerHTML = `
    <div class="results">
      <div class="session-num">session #${h.length}${cur.skipped ? ` · ${cur.skipped} skipped` : ""}</div>
      ${deltas}
      <div class="summary">
        <div><span>avg / scale</span><strong>${fmt(cur.avg_ms)}</strong><em>over ${cur.times.length} scale${cur.times.length === 1 ? "" : "s"}</em></div>
        <div><span>fastest scale</span><strong>${fmt(fastest.ms)}</strong><em>${chordName(fastest.scale)} · ${displayMode(modeOf(fastest.scale))}</em></div>
        <div><span>slowest scale</span><strong>${fmt(slowest.ms)}</strong><em>${chordName(slowest.scale)} · ${displayMode(modeOf(slowest.scale))}</em></div>
        ${cur.avg_cents !== null && cur.avg_cents !== undefined ? `<div><span>avg intonation</span><strong>±${cur.avg_cents}¢</strong>${prev?.avg_cents != null ? `<em>${cur.avg_cents < prev.avg_cents ? "▼" : cur.avg_cents > prev.avg_cents ? "▲" : "="} ${Math.abs(cur.avg_cents - prev.avg_cents).toFixed(1)}¢ vs prev</em>` : ""}</div>` : ""}
      </div>
      <div class="list">
        ${cur.times.map(t => {
          const c = t.ms === fastest.ms ? "fast" : t.ms === slowest.ms ? "slow" : "";
          return `<div class="${c}"><span>${chordName(t.scale)}</span><span class="row-mode">${displayMode(modeOf(t.scale))}</span><span>${fmt(t.ms)}</span></div>`;
        }).join("")}
      </div>
      <div class="hint">${restartHint()}</div>
    </div>
  `;
}

// ===== Events =====
// Keys that shouldn't count as "any key" — modifiers alone, and nav keys.
const INERT_KEYS = new Set(["Shift", "Control", "Alt", "Meta", "CapsLock", "Tab"]);

function advanceFromInput() {
  if (state === "ready") return beginPlaying();
  if (state === "playing") return completeCurrent();
  if (state === "done") return start();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts alone
  if (INERT_KEYS.has(e.key)) return;
  e.preventDefault();
  if (e.code === "Escape") return start();
  advanceFromInput();
});


// Pills are interactive on every device; only the empty background skips.
document.addEventListener("click", (e) => {
  const pill = e.target.closest(".sequence .note[data-slot]");
  if (pill) return jumpToSlot(Number(pill.dataset.slot));
  if (!isTouch()) return;
  if (e.target.closest("button, a, input, select, .brand")) return;
  advanceFromInput();
});

window.addEventListener("resize", fitChordSize);

// The mic is requested on load, but iOS often refuses without a user gesture,
// so retry on the first one. iOS also parks the context in "suspended".
document.getElementById("mic-warn").addEventListener("click", () => initMic());

// A backgrounded tab can suspend the context, so resume on any gesture.
async function ensureAudio() {
  if (audioCtx) return resumeAudioIfNeeded();
  if (await initMic() && state === "ready") render();
}
["pointerdown", "keydown"].forEach(evt =>
  document.addEventListener(evt, ensureAudio, { passive: true })
);

noteTracker = new NoteTracker((pc, cents) => currentMatcher?.input(pc, cents));

start();

// Ask for the mic and bring the graph up straight away on every device.
// If a browser hands back a suspended/silent context (iOS historically
// does), ensureAudio() rebuilds it on the first gesture.
requestMic().then(ok => {
  if (ok && startAudioGraph() && state === "ready") render();
});
</script>
</body>
</html>
