<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>apepeggios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #e0e0e0;
    --muted: #666;
    --dim: #333;
    --accent: #ffd866;
    --good: #8dd88d;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .brand {
    position: fixed;
    top: 1.25rem;
    left: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.1rem;
    font-family: "Lexend Deca", system-ui, -apple-system, sans-serif;
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: -0.01em;
    z-index: 10;
    user-select: none;
    text-decoration: none;
  }
  .brand .trumpet {
    display: inline-block;
    width: 44px;
    height: 44px;
    background: var(--accent);
    -webkit-mask: url("trumpet.png") center/contain no-repeat;
    mask: url("trumpet.png") center/contain no-repeat;
    transform: scaleX(-1);
  }
  .brand .wordmark { margin-left: -0.4rem; }
  .brand .ape { color: var(--accent); }
  .brand .peggios { color: var(--muted); }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 2rem; text-align: center; max-width: 100%; }
  .play-area { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
  .scale {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    letter-spacing: -0.02em;
    transition: color 0.15s;
  }
  .scale.success { color: var(--good); }
  .mode-label {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }
  .scale-title { display: flex; flex-direction: column; align-items: center; }
  .subtitle { font-size: clamp(1.5rem, 4vw, 2.5rem); color: var(--fg); font-weight: 500; }
  .hint { color: var(--muted); font-size: 0.9rem; }
  .hint strong { color: var(--fg); font-weight: 600; }
  .stats { display: flex; gap: 3rem; color: var(--muted); font-size: 1rem; font-variant-numeric: tabular-nums; }
  .stats strong { color: var(--fg); font-weight: 500; }
  .ready-meta { display: flex; gap: 2rem; color: var(--muted); font-size: 0.95rem; font-variant-numeric: tabular-nums; flex-wrap: wrap; justify-content: center; }
  .ready-meta span strong { color: var(--accent); font-weight: 500; }
  .widgets {
    display: flex; flex-direction: column; align-items: center; gap: 0.9rem;
    overflow: hidden;
    max-height: 40rem;
    transition: max-height 0.45s ease, opacity 0.35s ease, transform 0.45s ease, margin 0.45s ease;
  }
  .widgets.hiding { max-height: 0; opacity: 0; margin: 0 !important; }
  .widgets-top.hiding { transform: translateY(-1.5rem); }
  .widgets-bottom.hiding { transform: translateY(1.5rem); }
  .mode-toggles { flex-wrap: wrap; justify-content: center; max-width: 40rem; }
  .btn-reset {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--dim);
    padding: 0.35rem 0.5rem;
    font-family: inherit;
    cursor: pointer;
    border-radius: 3px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .btn-reset:hover { color: var(--fg); border-color: var(--muted); }
  .btn-reset svg { display: block; }
  .duration-radio { display: flex; gap: 0.3rem; justify-content: center; align-items: center; }
  .option-icon {
    color: var(--muted);
    line-height: 1;
    display: inline-flex;
    align-items: center;
    padding-right: 0.45rem;
    min-width: 1.6rem;
    justify-content: center;
  }
  .option-icon svg { width: 20px; height: 20px; display: block; }
  .option-icon.icon-clef {
    font-family: "Bravura Text", "Segoe UI Symbol", "Apple Symbols", serif;
    font-size: 2.4rem;
    line-height: 0.6;
    padding-bottom: 0.15rem;
  }
  .duration-radio button {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--dim);
    padding: 0.25rem 0.7rem;
    font-family: inherit;
    font-size: 0.78rem;
    cursor: pointer;
    border-radius: 3px;
    font-variant-numeric: tabular-nums;
    min-width: 2.3rem;
  }
  .duration-radio button:hover { color: var(--fg); border-color: var(--muted); }
  .duration-radio button.selected {
    color: var(--accent);
    border-color: var(--accent);
  }
  .btn-mic-inline {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 0.4rem 0.9rem;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    border-radius: 4px;
  }
  .btn-mic-inline:hover { background: rgba(255, 216, 102, 0.1); }

  .sequence {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.35rem;
    max-width: 60rem;
  }
  .sequence .note {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 2.5rem;
    padding: 0.35rem 0.55rem;
    border: 1px solid var(--dim);
    border-radius: 4px;
    font-size: 0.95rem;
    color: var(--muted);
    transition: background 0.1s, color 0.1s, border-color 0.1s;
  }
  .sequence .note.phase-up {
    background: rgba(109, 180, 238, 0.15);
    color: #6db4ee;
    border-color: #6db4ee;
  }
  .sequence .note.phase-down {
    background: rgba(141, 216, 141, 0.15);
    color: var(--good);
    border-color: var(--good);
  }
  .sequence .note.phase-arp {
    background: rgba(255, 216, 102, 0.22);
    color: var(--accent);
    border-color: var(--accent);
  }
  .sequence .note.current {
    box-shadow: 0 0 0 2px var(--fg);
  }
  .sequence.wrong .note {
    border-color: var(--bad) !important;
    color: var(--bad) !important;
    background: rgba(255, 107, 107, 0.1) !important;
  }

  .heard {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 90px;
    width: 120px;
  }
  .heard svg { width: 100%; height: 100%; }
  .heard-circle { fill: transparent; stroke: var(--dim); stroke-width: 1.5; }
  .heard-text {
    fill: var(--fg);
    font-size: 22px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 0.75rem 1.5rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    border-radius: 4px;
  }
  .btn-primary:hover { background: #ffe088; }

  .results { max-width: 44rem; width: 100%; }
  .results h1 { font-size: 2rem; margin-bottom: 0.25rem; font-weight: 600; }
  .session-num { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .deltas { display: flex; gap: 1.5rem; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .deltas .better { color: var(--good); }
  .deltas .worse { color: var(--bad); }
  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem 2rem; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--dim); }
  .summary div span { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .summary div strong { font-size: 1.4rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--accent); }
  .summary div em { display: block; color: var(--fg); font-size: 0.8rem; font-style: normal; margin-top: 0.15rem; }
  .list { max-height: 35vh; overflow-y: auto; font-variant-numeric: tabular-nums; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .list div { display: flex; justify-content: space-between; padding: 0.4rem 0; border-bottom: 1px solid var(--dim); }
  .list div:last-child { border-bottom: none; }
  .list .fast { color: var(--accent); }
  .list .slow { color: var(--bad); }

  .mic-warn {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--bad);
    border: 1px solid var(--bad);
    padding: 0.35rem 0.7rem;
    border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.75rem;
    background: rgba(255, 107, 107, 0.08);
    z-index: 10;
  }
  .mic-warn::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bad);
  }
  .mic-warn.hidden { display: none; }
</style>
</head>
<body>
<a class="brand" href="/" aria-label="apepeggios">
  <span class="trumpet" aria-hidden="true"></span>
  <span class="wordmark"><span class="ape">ape</span><span class="peggios">peggios</span></span>
</a>
<div id="app"></div>
<div id="mic-warn" class="mic-warn">mic muted</div>
<script>
// ===== Music theory =====
const keySharpsMajor = {
  "C♭": -7, "G♭": -6, "D♭": -5, "A♭": -4, "E♭": -3, "B♭": -2, "F": -1,
  "C": 0, "G": 1, "D": 2, "A": 3, "E": 4, "B": 5, "F#": 6, "C#": 7,
};
const modeOffsets = {
  "Major": 0, "Mixolydian": -1, "Dorian": -2, "Minor": -3, "Blues": -3,
  "MelodicMinor": -3, "HarmonicMinor": -3,
};
const modeIntervals = {
  "Major":         [0, 2, 4, 5, 7, 9, 11],
  "Minor":         [0, 2, 3, 5, 7, 8, 10],
  "Mixolydian":    [0, 2, 4, 5, 7, 9, 10],
  "Dorian":        [0, 2, 3, 5, 7, 9, 10],
  "Blues":         [0, 3, 5, 6, 7, 10],
  "MelodicMinor":  [0, 2, 3, 5, 7, 9, 11],
  "HarmonicMinor": [0, 2, 3, 5, 7, 8, 11],
};
const arpeggioIntervals = {
  "Major":         [0, 4, 7, 11],
  "Minor":         [0, 3, 7, 10],
  "Mixolydian":    [0, 4, 7, 10],
  "Dorian":        [0, 3, 7, 10],
  "Blues":         [0, 4, 7, 10],
  "MelodicMinor":  [0, 3, 7, 11],
  "HarmonicMinor": [0, 3, 7, 11],
};
const rootPC = {
  "C": 0, "C#": 1, "D♭": 1, "D": 2, "E♭": 3, "E": 4, "F": 5,
  "F#": 6, "G♭": 6, "G": 7, "A♭": 8, "A": 9, "B♭": 10, "B": 11, "C♭": 11,
};
const sharpNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const flatNames  = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];
const STORAGE_KEY = "scales-history-v1";
const WEIGHTS_KEY = "scales-weights-v1";
const DURATION_KEY = "scales-duration-v1";
const TRANSPOSITION_KEY = "scales-transposition-v1";
const transpositions = {
  "C":  0,   // concert
  "B♭": -2,  // trumpet, tenor sax, clarinet
  "E♭": 3,   // alto sax, bari sax
  "F":  -7,  // french horn
};
const defaultTransposition = "B♭";
function loadTransposition() { return localStorage.getItem(TRANSPOSITION_KEY) || defaultTransposition; }
function saveTransposition(t) { localStorage.setItem(TRANSPOSITION_KEY, t); }
const defaultWeights = {
  "Major": 1, "Minor": 1, "Mixolydian": 1, "Dorian": 1, "Blues": 1,
  "MelodicMinor": 0, "HarmonicMinor": 0,
};
const allModes = ["Major", "Minor", "Dorian", "Mixolydian", "Blues", "MelodicMinor", "HarmonicMinor"];
const defaultDuration = "unlimited";
const durationOptions = ["10", "20", "30", "unlimited"];  // minutes
function loadDuration() { return localStorage.getItem(DURATION_KEY) || defaultDuration; }
function saveDuration(d) { localStorage.setItem(DURATION_KEY, d); }


function loadWeights() {
  try {
    const raw = localStorage.getItem(WEIGHTS_KEY);
    if (!raw) return { ...defaultWeights };
    return { ...defaultWeights, ...JSON.parse(raw) };
  } catch { return { ...defaultWeights }; }
}
function saveWeightsToStorage(w) { localStorage.setItem(WEIGHTS_KEY, JSON.stringify(w)); }

function activePools(w) {
  const pools = {};
  for (const [mode, wt] of Object.entries(w)) {
    if (wt <= 0) continue;
    pools[mode] = [];
    for (const [key, sig] of Object.entries(keySharpsMajor)) {
      const s = sig + modeOffsets[mode];
      if (s >= -7 && s <= 7) pools[mode].push(`${key} ${mode}`);
    }
  }
  return pools;
}

// One of each active-mode scale, shuffled (used for unlimited sessions).
function buildUnlimitedList(w) {
  const pools = activePools(w);
  const out = [];
  for (const mode of Object.keys(pools)) out.push(...pools[mode]);
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

// Weighted random draw of one scale (used for timed sessions).
function sampleScale(w) {
  const pools = activePools(w);
  const modes = Object.keys(pools);
  if (modes.length === 0) return null;
  const totalW = modes.reduce((s, m) => s + w[m], 0);
  let r = Math.random() * totalW;
  for (const m of modes) {
    r -= w[m];
    if (r <= 0) {
      const pool = pools[m];
      return pool[Math.floor(Math.random() * pool.length)];
    }
  }
  const last = modes[modes.length - 1];
  return pools[last][Math.floor(Math.random() * pools[last].length)];
}

function estimatedScales(w, duration) {
  if (duration === "unlimited") return buildUnlimitedList(w).length;
  // Rough estimate based on user's average per-scale time (~30s) — for UI hint only.
  return Math.round(parseInt(duration, 10) * 60 / 30);
}
function useFlats(scaleName) {
  const [key, mode] = scaleName.split(" ");
  return keySharpsMajor[key] + modeOffsets[mode] < 0;
}
function noteName(pc, flats) {
  return (flats ? flatNames : sharpNames)[((pc % 12) + 12) % 12];
}
function letterOnly(name) { return name.replace(/[#♭]/g, ""); }
const chordSuffix = {
  "Major": "maj7", "Minor": "min7", "Mixolydian": "7", "Dorian": "min7", "Blues": "7",
  "MelodicMinor": "minMaj7", "HarmonicMinor": "minMaj7",
};
function chordName(scaleName) {
  const [key, mode] = scaleName.split(" ");
  return key + chordSuffix[mode];
}
function modeOf(scaleName) { return scaleName.split(" ")[1]; }
function displayMode(mode) { return mode.replace(/([a-z])([A-Z])/g, "$1 $2"); }
const modeShort = {
  "Major": "maj", "Minor": "min", "Dorian": "dor", "Mixolydian": "mix",
  "Blues": "blu", "MelodicMinor": "mel", "HarmonicMinor": "har",
};
function expectedSequence(scaleName, transposeSemi = 0) {
  const [key, mode] = scaleName.split(" ");
  const root = rootPC[key];
  const scale = modeIntervals[mode].map(i => (i + root) % 12);
  const arp = arpeggioIntervals[mode].map(i => (i + root) % 12);
  const slotOfPc = {};
  scale.forEach((pc, i) => { slotOfPc[pc] = i; });
  const octaveSlot = scale.length;
  const displayPcs = [...scale, root];
  const up = [...scale, root];
  const down = [...scale].reverse();
  const arpUp = arp.slice(1);                  // 3-5-7
  const arpDown = arp.slice(0, -1).reverse();  // 5-3-root
  const writtenPcs = [...up, ...down, ...arpUp, ...arpDown];
  const slotsUp = [...scale.map((_, i) => i), octaveSlot];
  const slotsDown = scale.map((_, i) => scale.length - 1 - i);
  const slots = [...slotsUp, ...slotsDown,
                 ...arpUp.map(pc => slotOfPc[pc]),
                 ...arpDown.map(pc => slotOfPc[pc])];
  const toConcert = pc => ((pc + transposeSemi) % 12 + 12) % 12;
  const pcs = writtenPcs.map(toConcert);
  const upEnd = up.length;
  const downEnd = upEnd + down.length;
  return { pcs, upEnd, downEnd, displayPcs, slots, bars: new Set() };
}

function phaseAt(idx, exp) {
  if (idx < exp.upEnd) return "up";
  if (idx < exp.downEnd) return "down";
  return "arp";
}

// ===== Pitch detection (autocorrelation) =====
function autoCorrelate(buf, sampleRate) {
  const SIZE = buf.length;
  let sumSq = 0;
  for (let i = 0; i < SIZE; i++) sumSq += buf[i] * buf[i];
  const rms = Math.sqrt(sumSq / SIZE);
  if (rms < 0.005) return { freq: -1, rms };

  let r1 = 0, r2 = SIZE - 1;
  const thres = 0.2;
  for (let i = 0; i < SIZE / 2; i++)
    if (Math.abs(buf[i]) < thres) { r1 = i; break; }
  for (let i = 1; i < SIZE / 2; i++)
    if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }
  const trimmed = buf.slice(r1, r2);
  const N = trimmed.length;
  if (N < 64) return { freq: -1, rms };

  const c = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    let s = 0;
    for (let j = 0; j < N - i; j++) s += trimmed[j] * trimmed[j + i];
    c[i] = s;
  }

  let d = 0;
  while (d + 1 < N && c[d] > c[d + 1]) d++;
  let maxv = -Infinity, maxi = -1;
  for (let i = d; i < N; i++) if (c[i] > maxv) { maxv = c[i]; maxi = i; }
  if (maxi < 1 || maxi >= N - 1) return { freq: -1, rms };

  const x1 = c[maxi - 1], x2 = c[maxi], x3 = c[maxi + 1];
  const a = (x1 + x3 - 2 * x2) / 2;
  const b = (x3 - x1) / 2;
  const T0 = maxi - (a ? b / (2 * a) : 0);
  const freq = sampleRate / T0;
  if (freq < 130 || freq > 1400) return { freq: -1, rms };  // ~trumpet range
  return { freq, rms };
}

function freqToPC(freq) {
  const midi = Math.round(69 + 12 * Math.log2(freq / 440));
  return ((midi % 12) + 12) % 12;
}
function freqToCents(freq) {
  const midi = 69 + 12 * Math.log2(freq / 440);
  return (midi - Math.round(midi)) * 100;  // in [-50, 50)
}

// ===== Note tracker: emits a note event on each stable pitch onset =====
class NoteTracker {
  constructor(onNote) {
    this.onNote = onNote;
    this.reset();
    this.STABILITY = 2;
    this.RMS_ON = 0.012;
    this.RMS_OFF = 0.004;
  }
  reset() {
    this.state = "silent";
    this.currentPC = -1;
    this.candPC = -1;
    this.candCount = 0;
  }
  process(rms, freq, time) {
    if (this.state === "playing" && rms < this.RMS_OFF) {
      this.state = "silent"; this.currentPC = -1; this.candPC = -1; this.candCount = 0;
      return;
    }
    if (this.state === "silent" && rms < this.RMS_ON) return;
    const pc = freq > 0 ? freqToPC(freq) : -1;
    if (pc < 0) return;
    const cents = freqToCents(freq);

    if (this.state === "silent") {
      if (this.candPC === pc) this.candCount++;
      else { this.candPC = pc; this.candCount = 1; }
      if (this.candCount >= this.STABILITY) {
        this.state = "playing"; this.currentPC = pc;
        this.candPC = -1; this.candCount = 0;
        this.onNote(pc, time, cents);
      }
    } else {
      if (pc === this.currentPC) { this.candPC = -1; this.candCount = 0; }
      else if (pc === this.candPC) {
        this.candCount++;
        if (this.candCount >= this.STABILITY) {
          this.currentPC = pc; this.candPC = -1; this.candCount = 0;
          this.onNote(pc, time, cents);
        }
      } else { this.candPC = pc; this.candCount = 1; }
    }
  }
}

// ===== Matcher =====
class Matcher {
  constructor(expected, onProgress, onSuccess, onWrong) {
    this.expected = expected;
    this.matchIdx = 0;
    this.times = [];
    this.cents = [];
    this.onProgress = onProgress;
    this.onSuccess = onSuccess;
    this.onWrong = onWrong;
  }
  input(pc, time, cents = 0) {
    if (pc === this.expected.pcs[this.matchIdx]) {
      this.times.push(time);
      this.cents.push(cents);
      this.matchIdx++;
      this.onProgress(this.matchIdx);
      if (this.matchIdx === this.expected.pcs.length) {
        this.onSuccess(this.times, timingCV(this.times, [...this.expected.bars]));
      }
    } else {
      this.onWrong();
      this.matchIdx = 0;
      this.times = [];
      this.cents = [];
    }
  }
}

function timingCV(times, breaks) {
  const boundaries = [0, ...breaks, times.length];
  const iois = [];
  for (let s = 0; s < boundaries.length - 1; s++) {
    const seg = times.slice(boundaries[s], boundaries[s + 1]);
    for (let i = 1; i < seg.length; i++) iois.push(seg[i] - seg[i - 1]);
  }
  if (iois.length < 2) return 0;
  const mean = iois.reduce((a, b) => a + b, 0) / iois.length;
  const variance = iois.reduce((s, x) => s + (x - mean) ** 2, 0) / iois.length;
  return Math.sqrt(variance) / mean;
}

const TIMING_CV_MAX = 1.2;  // lenient (higher = more forgiving)

// ===== Audio =====
let audioCtx = null, analyser = null, mediaStream = null, audioBuf = null;
let noteTracker = null;
let smoothedCents = 0;

async function initMic(silent = false) {
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: { ideal: false },
        noiseSuppression: { ideal: false },
        autoGainControl: { ideal: false },
      }
    });
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(mediaStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    audioBuf = new Float32Array(analyser.fftSize);
    setMicStatus(true);
    detectLoop();
    return true;
  } catch (e) {
    if (!silent) {
      alert("Microphone access failed: " + e.message +
        "\n\nMake sure this page was loaded via http:// or https://, not file://.\nTry:  python3 -m http.server 8000");
    }
    setMicStatus(false);
    return false;
  }
}
async function resumeAudioIfNeeded() {
  if (audioCtx && audioCtx.state === "suspended") {
    try { await audioCtx.resume(); } catch {}
  }
}
function setMicStatus(on) {
  const el = document.getElementById("mic-warn");
  if (el) el.classList.toggle("hidden", on);
}
function detectLoop() {
  if (!analyser) return;
  analyser.getFloatTimeDomainData(audioBuf);
  const { freq, rms } = autoCorrelate(audioBuf, audioCtx.sampleRate);
  const active = state === "playing" || state === "ready";
  if (noteTracker && active) noteTracker.process(rms, freq, performance.now());
  const heardEl = document.getElementById("heard");
  if (heardEl && active && scales[index]) {
    const flats = useFlats(scales[index]);
    const textEl = heardEl.querySelector(".heard-text");
    if (freq > 0 && textEl) {
      const concertPc = freqToPC(freq);
      const t = transpositions[transposition] || 0;
      const writtenPc = ((concertPc - t) % 12 + 12) % 12;
      textEl.textContent = noteName(writtenPc, flats);
    } else if (textEl) {
      textEl.textContent = "—";
    }
  }
  requestAnimationFrame(detectLoop);
}

// ===== App state =====
const app = document.getElementById("app");
let scales, times, state, startTime, scaleStart, index;
let currentExpected = null, currentMatcher = null;
let weights = loadWeights();
let duration = loadDuration();
let transposition = loadTransposition();
let targetMs = null;  // null = unlimited

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}
function fmt(ms) {
  const s = ms / 1000;
  if (s < 60) return s.toFixed(2) + "s";
  const m = Math.floor(s / 60);
  const rem = (s % 60).toFixed(1).padStart(4, "0");
  return `${m}m ${rem}s`;
}
function loadHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const d = JSON.parse(raw);
    return Array.isArray(d) ? d : [];
  } catch { return []; }
}
function saveHistory(h) { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); }

function resetSession() {
  times = [];
  index = 0;
  startTime = null;
  if (duration === "unlimited") {
    scales = buildUnlimitedList(weights);
    targetMs = null;
  } else {
    scales = [];
    const first = sampleScale(weights);
    if (first) scales.push(first);
    targetMs = parseInt(duration, 10) * 60 * 1000;
  }
}

function start() {
  resetSession();
  state = "ready";
  render();
}

function render() {
  if (state === "ready") return renderReady();
  if (state === "done") return renderResults();
  renderPlaying();
}

function playAreaHTML(scaleName) {
  if (!scaleName) return `<div class="subtitle">no modes on</div>`;
  const exp = expectedSequence(scaleName, transpositions[transposition] || 0);
  currentExpected = exp;
  const flats = useFlats(scaleName);
  const seqHTML = exp.displayPcs.map((pc, i) => {
    const full = noteName(pc, flats);
    return `<span class="note" data-slot="${i}" data-full="${full}">${letterOnly(full)}</span>`;
  }).join("");
  const heardHTML = audioCtx ? `
    <div class="heard" id="heard">
      <svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg">
        <circle class="heard-circle" cx="60" cy="45" r="26"/>
        <text class="heard-text" x="60" y="53" text-anchor="middle">—</text>
      </svg>
    </div>
  ` : "";
  return `
    <div class="scale-title">
      <div class="scale">${chordName(scaleName)}</div>
      <div class="mode-label">${displayMode(modeOf(scaleName))}</div>
    </div>
    <div class="sequence" id="sequence">${seqHTML}</div>
    ${heardHTML}
  `;
}

function renderReady() {
  const h = loadHistory();
  const scaleName = scales[index];
  let meta = "";
  if (h.length > 0) {
    const best = h.reduce((b, s) => s.total_ms < b.total_ms ? s : b);
    const last = h[h.length - 1];
    meta = `<div class="ready-meta">
      <span>sessions <strong>${h.length}</strong></span>
      <span>best <strong>${fmt(best.total_ms)}</strong></span>
      <span>last <strong>${fmt(last.total_ms)}</strong></span>
    </div>`;
  }
  const durationButtons = durationOptions.map(d =>
    `<button class="${d === duration ? "selected" : ""}" data-dur="${d}">${d === "unlimited" ? "∞" : d}</button>`).join("");
  const transposeButtons = Object.keys(transpositions).map(t =>
    `<button class="${t === transposition ? "selected" : ""}" data-trans="${t}">${t}</button>`).join("");
  const modeButtons = allModes.map(m =>
    `<button class="${weights[m] > 0 ? "selected" : ""}" data-mode-toggle="${m}">${modeShort[m]}</button>`).join("");

  app.innerHTML = `
    <div class="stage">
      <div class="widgets widgets-top">
        ${meta}
        <div class="duration-radio" id="duration-radio"><span class="option-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M10 5v5l3 2"/></svg>
        </span>${durationButtons}</div>
        <div class="duration-radio" id="transpose-radio"><span class="option-icon icon-clef" aria-hidden="true">𝄞</span>${transposeButtons}</div>
      </div>
      <div class="play-area">${playAreaHTML(scaleName)}</div>
      <div class="widgets widgets-bottom">
        <div class="duration-radio mode-toggles" id="mode-toggles">${modeButtons}</div>
        <button class="btn-reset" id="btn-reset" title="reset to defaults" aria-label="reset to defaults">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg>
        </button>
        ${!audioCtx ? `<button class="btn-mic-inline" id="btn-enable-mic">enable microphone for auto-advance</button>` : ""}
      </div>
    </div>
  `;

  if (scaleName) {
    updateSequenceUI(0);
    setupMatcher();
  } else {
    currentMatcher = null;
  }
  attachReadyHandlers();
}

function attachReadyHandlers() {
  document.getElementById("btn-reset")?.addEventListener("click", () => {
    weights = { ...defaultWeights };
    duration = defaultDuration;
    saveWeightsToStorage(weights);
    saveDuration(duration);
    start();
  });
  document.querySelectorAll("#duration-radio button").forEach(btn => {
    btn.addEventListener("click", (e) => {
      duration = e.currentTarget.dataset.dur;
      saveDuration(duration);
      document.querySelectorAll("#duration-radio button").forEach(b => b.classList.toggle("selected", b === e.currentTarget));
      resetSession();
      refreshPlayArea();
    });
  });
  document.querySelectorAll("#transpose-radio button").forEach(btn => {
    btn.addEventListener("click", (e) => {
      transposition = e.currentTarget.dataset.trans;
      saveTransposition(transposition);
      document.querySelectorAll("#transpose-radio button").forEach(b => b.classList.toggle("selected", b === e.currentTarget));
      refreshPlayArea();
    });
  });
  document.querySelectorAll("#mode-toggles button").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const mode = e.currentTarget.dataset.modeToggle;
      weights[mode] = weights[mode] > 0 ? 0 : 1;
      saveWeightsToStorage(weights);
      e.currentTarget.classList.toggle("selected", weights[mode] > 0);
      resetSession();
      refreshPlayArea();
    });
  });
  document.getElementById("btn-enable-mic")?.addEventListener("click", async () => {
    const ok = await initMic();
    if (ok) render();
  });
}

function refreshPlayArea() {
  const playArea = document.querySelector(".play-area");
  if (!playArea) return;
  playArea.innerHTML = playAreaHTML(scales[index]);
  if (scales[index]) {
    updateSequenceUI(0);
    setupMatcher();
  } else {
    currentMatcher = null;
  }
}

function setupMatcher() {
  if (!audioCtx || !noteTracker || !currentExpected) { currentMatcher = null; return; }
  noteTracker.reset();
  currentMatcher = new Matcher(
    currentExpected,
    (idx) => {
      updateSequenceUI(idx);
      if (state === "ready" && idx === 1) beginPlaying();
    },
    (t, cv) => onSequenceComplete(cv),
    () => flashWrong(),
  );
}

function beginPlaying() {
  if (state !== "ready" || !scales[index]) return;
  resumeAudioIfNeeded();
  const now = performance.now();
  startTime = now;
  scaleStart = now;
  state = "playing";
  const widgets = document.querySelectorAll(".widgets");
  widgets.forEach(w => w.classList.add("hiding"));
  setTimeout(() => widgets.forEach(w => w.remove()), 460);
  const playArea = document.querySelector(".play-area");
  if (playArea && !playArea.querySelector(".stats")) {
    playArea.insertAdjacentHTML("beforeend", `
      <div class="stats">
        <span><strong>${index + 1}</strong>${targetMs === null ? " / " + scales.length : ""}</span>
        <span id="timer"><strong>0.00s</strong></span>
      </div>
      <div class="hint">${audioCtx ? "auto-advances on correct play · " : ""}<strong>space</strong> skips · <strong>esc</strong> restarts</div>
    `);
  }
  tickTimer();
}

function renderPlaying() {
  const scaleName = scales[index];
  app.innerHTML = `
    <div class="stage">
      <div class="play-area">${playAreaHTML(scaleName)}
        <div class="stats">
          <span><strong>${index + 1}</strong>${targetMs === null ? " / " + scales.length : ""}</span>
          <span id="timer"><strong>0.00s</strong></span>
        </div>
        <div class="hint">${audioCtx ? "auto-advances on correct play · " : ""}<strong>space</strong> skips · <strong>esc</strong> restarts</div>
      </div>
    </div>
  `;
  updateSequenceUI(0);
  setupMatcher();
  tickTimer();
}

function tuningArcPath(cents) {
  // Fixed-size SVG (viewBox 0 0 120 140, circle centered at 60,70 r=26).
  // Sharp → arc above circle, curving upward. Flat → arc below, curving downward.
  if (Math.abs(cents) < 4) return "";
  const c = Math.max(-40, Math.min(40, cents));
  const sharp = c > 0;
  const dist = 30 + Math.abs(c) / 40 * 16;   // 30..46 from circle center
  const arcY = sharp ? 70 - dist : 70 + dist;
  const controlY = sharp ? arcY - 8 : arcY + 8;
  return `M ${60 - 26} ${arcY} Q 60 ${controlY} ${60 + 26} ${arcY}`;
}

function centsToFilter(cents) {
  // Flat → darker (brightness < 1). Sharp → whiter (brightness > 1, less saturated).
  const c = Math.max(-50, Math.min(50, cents));
  if (c < 0) return `brightness(${(1 + c / 60).toFixed(2)})`;
  if (c > 0) return `brightness(${(1 + c / 100).toFixed(2)}) saturate(${(1 - c / 70).toFixed(2)})`;
  return "";
}
function updateSequenceUI(matchIdx) {
  const exp = currentExpected;
  if (!exp) return;
  document.querySelectorAll(".sequence .note").forEach(n => {
    n.classList.remove("phase-up", "phase-down", "phase-arp", "current");
    n.style.filter = "";
  });
  const centsArr = currentMatcher?.cents || [];
  for (let i = 0; i < matchIdx; i++) {
    const slot = exp.slots[i];
    if (slot === undefined) continue;
    const el = document.querySelector(`.sequence .note[data-slot="${slot}"]`);
    if (!el) continue;
    const phase = phaseAt(i, exp);
    el.classList.add(`phase-${phase}`);
    if (el.dataset.full) el.textContent = el.dataset.full;
    const c = centsArr[i];
    if (checkIntonation && typeof c === "number") el.style.filter = centsToFilter(c);
  }
  if (matchIdx < exp.pcs.length) {
    const slot = exp.slots[matchIdx];
    if (slot !== undefined) {
      const el = document.querySelector(`.sequence .note[data-slot="${slot}"]`);
      if (el) el.classList.add("current");
    }
  }
}

let wrongTimer = null;
function flashWrong() {
  const seq = document.getElementById("sequence");
  if (!seq) return;
  seq.classList.add("wrong");
  clearTimeout(wrongTimer);
  wrongTimer = setTimeout(() => seq.classList.remove("wrong"), 250);
  updateSequenceUI(0);
}

function onSequenceComplete(cv) {
  currentMatcher = null;
  const scaleEl = document.querySelector(".scale");
  if (scaleEl) scaleEl.classList.add("success");
  document.querySelectorAll(".sequence .note").forEach(n => n.classList.remove("current"));
  // If timing was too uneven, still advance (lenient) but could optionally require retry.
  // Keeping lenient per user preference.
  setTimeout(completeCurrent, cv > TIMING_CV_MAX ? 600 : 350);
}

function completeCurrent() {
  const now = performance.now();
  const cList = currentMatcher?.cents || [];
  const avgCents = cList.length ? cList.reduce((s, c) => s + Math.abs(c), 0) / cList.length : null;
  times.push({ scale: scales[index], ms: now - scaleStart, cents: avgCents });
  scaleStart = now;
  index++;
  const elapsed = now - startTime;
  const timeUp = targetMs !== null && elapsed >= targetMs;
  const listDone = targetMs === null && index >= scales.length;
  if (timeUp || listDone) {
    state = "done";
    recordSession();
    render();
    return;
  }
  if (targetMs !== null && index >= scales.length) {
    const next = sampleScale(weights);
    if (next) scales.push(next);
  }
  render();
}

function tickTimer() {
  const el = document.getElementById("timer");
  if (!el || state !== "playing") return;
  const elapsed = performance.now() - startTime;
  const display = targetMs !== null ? Math.max(0, targetMs - elapsed) : elapsed;
  el.innerHTML = `<strong>${fmt(display)}</strong>`;
  requestAnimationFrame(tickTimer);
}


function recordSession() {
  const total = times.reduce((s, t) => s + t.ms, 0);
  const cList = times.map(t => t.cents).filter(c => typeof c === "number");
  const avgCents = cList.length ? cList.reduce((a, b) => a + b, 0) / cList.length : null;
  const session = {
    date: new Date().toISOString(),
    total_ms: Math.round(total),
    avg_ms: Math.round(total / times.length),
    avg_cents: avgCents !== null ? Math.round(avgCents * 10) / 10 : null,
    times: times.map(t => ({
      scale: t.scale,
      ms: Math.round(t.ms),
      cents: typeof t.cents === "number" ? Math.round(t.cents * 10) / 10 : null,
    })),
  };
  const h = loadHistory();
  h.push(session);
  saveHistory(h);
}

function deltaHTML(cur, other, label) {
  const d = cur - other;
  if (d === 0) return `<span>= ${label}</span>`;
  const cls = d < 0 ? "better" : "worse";
  const arrow = d < 0 ? "▼" : "▲";
  return `<span class="${cls}">${arrow} ${fmt(Math.abs(d))} vs ${label}</span>`;
}

function renderResults() {
  const h = loadHistory();
  const cur = h[h.length - 1];
  const prev = h.length > 1 ? h[h.length - 2] : null;
  const best = h.reduce((b, s) => s.total_ms < b.total_ms ? s : b);
  const isPB = cur.total_ms === best.total_ms && h.length > 1;
  const sorted = cur.times.slice().sort((a, b) => a.ms - b.ms);
  const fastest = sorted[0], slowest = sorted[sorted.length - 1];
  let deltas = "";
  if (prev) {
    deltas = `<div class="deltas">
      ${deltaHTML(cur.total_ms, prev.total_ms, "prev")}
      ${deltaHTML(cur.total_ms, best.total_ms, "best")}
      ${isPB ? '<span class="better">★ new best</span>' : ""}
    </div>`;
  }
  app.innerHTML = `
    <div class="results">
      <h1>done</h1>
      <div class="session-num">session #${h.length}</div>
      ${deltas}
      <div class="summary">
        <div><span>total</span><strong>${fmt(cur.total_ms)}</strong></div>
        <div><span>avg / scale</span><strong>${fmt(cur.avg_ms)}</strong></div>
        <div><span>fastest</span><strong>${fmt(fastest.ms)}</strong><em>${chordName(fastest.scale)} · ${displayMode(modeOf(fastest.scale))}</em></div>
        <div><span>slowest</span><strong>${fmt(slowest.ms)}</strong><em>${chordName(slowest.scale)} · ${displayMode(modeOf(slowest.scale))}</em></div>
        ${cur.avg_cents !== null && cur.avg_cents !== undefined ? `<div><span>avg intonation</span><strong>±${cur.avg_cents}¢</strong>${prev?.avg_cents != null ? `<em>${cur.avg_cents < prev.avg_cents ? "▼" : cur.avg_cents > prev.avg_cents ? "▲" : "="} ${Math.abs(cur.avg_cents - prev.avg_cents).toFixed(1)}¢ vs prev</em>` : ""}</div>` : ""}
      </div>
      <div class="list">
        ${cur.times.map(t => {
          const c = t.ms === fastest.ms ? "fast" : t.ms === slowest.ms ? "slow" : "";
          return `<div class="${c}"><span>${chordName(t.scale)} · ${displayMode(modeOf(t.scale))}</span><span>${fmt(t.ms)}</span></div>`;
        }).join("")}
      </div>
      <div class="hint">press <strong>space</strong> or <strong>esc</strong> to restart</div>
    </div>
  `;
}

// ===== Events =====
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") {
    e.preventDefault();
    if (state === "ready") return beginPlaying();
    if (state === "playing") return completeCurrent();
    if (state === "done") return start();
  } else if (e.code === "Escape") {
    e.preventDefault();
    start();
  }
});

// iOS: audio context often lands in "suspended"; resume on any user gesture.
["click", "touchend", "keydown"].forEach(evt =>
  document.addEventListener(evt, resumeAudioIfNeeded, { passive: true })
);

noteTracker = new NoteTracker((pc, time, cents) => {
  if (currentMatcher) currentMatcher.input(pc, time, cents);
});

start();

(async () => {
  try {
    const perm = await navigator.permissions.query({ name: "microphone" });
    if (perm.state === "granted") {
      if (await initMic(true) && state === "ready") render();
      return;
    }
  } catch {}
  if (await initMic(true) && state === "ready") render();
})();
</script>
</body>
